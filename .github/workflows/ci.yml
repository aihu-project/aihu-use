name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
      - name: Pin npm
        run: |
          npm install --global npm@11.5.1
          test "$(npm --version)" = 11.5.1
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Registry and artifact drift gates
        run: |
          npm run check:registry-parity
          npm run check:composable-registry
      - name: Verify exact package archive
        run: npm run verify:pack
      - name: Verify isolated consumer
        run: npm run consumer:smoke -- "$AIHU_PACK_PATH"
